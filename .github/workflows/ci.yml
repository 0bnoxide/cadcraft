name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 120
      # The fork gates on Windows too (Greg's dev machine); rust-cache saves on main only.
      os: '["ubuntu-24.04","windows-latest"]'
      # Fork only: the Windows leg builds and runs the tests; the Linux leg runs the full
      # `cargo xtask ci`. That saves Windows a full clippy build. Lost: clippy on cfg(windows) code,
      # which still has to compile for the tests.
      windows-command: cargo nextest run --workspace --lib --bins --tests
      # EXPERIMENT (not for merge as is): workspace crates at opt-level 0 (dependencies stay at 2
      # via profile.dev.package."*") and rust-lld instead of link.exe for the ~160 test binaries.
      windows-env: |
        CARGO_PROFILE_DEV_OPT_LEVEL=0
        CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe
      # EXPERIMENT: lets a manually dispatched run of this branch save its own cache, so a second
      # dispatch measures a warm build.
      cache-save-on-dispatch: true
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev
