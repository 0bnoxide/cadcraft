[package]
name = "cadcraft-engine"
description = "CADCraft engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-dxf = { workspace = true }
cadcraft-constraints = { workspace = true }
cadcraft-fonts = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-handoff = { workspace = true }
cadcraft-survey = { workspace = true }
cadcraft-surface = { workspace = true }
cadcraft-droneqa = { workspace = true }
cadcraft-labels = { workspace = true }
cadcraft-subsurface = { workspace = true }
cadcraft-proposal = { workspace = true }
craft-docpath = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios", target_os = "redox"))'.dependencies]
# Existing lockfile version; safe exclusive rename, MIT OR Apache-2.0.
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
cadcraft-io = { workspace = true }
# Build a handoff package (manifest digest, ZIP CRCs) in the TINEXPORT round-trip test; agreed with Codex (Paseo 3735d7f1).
sha2 = "0.10"
crc32fast = "1"
